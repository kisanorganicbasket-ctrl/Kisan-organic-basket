<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisan Organic Basket</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f7f0;margin:0;padding:16px;color:#243024}
main{max-width:600px;margin:auto}header,.card{background:white;border-radius:12px;padding:18px;margin-bottom:14px}
header{background:#237a3b;color:white;text-align:center}h1{margin:0 0 6px;font-size:24px}
h2{color:#237a3b;margin-top:0;font-size:20px}.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
small{display:block;color:#667;margin-top:4px}.qty{display:flex;align-items:center;gap:10px}
.qty button{font-size:20px;width:34px;height:34px;border:0;border-radius:7px;background:#e5f3e6;color:#17632b}
label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbcbbb;border-radius:8px;font-size:16px}
textarea{min-height:80px}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;padding-top:12px}
.submit{width:100%;padding:14px;background:#237a3b;color:white;border:0;border-radius:8px;font-size:17px;margin-top:16px}
.note{font-size:13px;color:#667}#result{display:none;white-space:pre-wrap;background:#eef8ee;padding:14px;border-radius:8px;margin-top:14px;line-height:1.6}
</style></head><body><main>
<header><h1>🧺 Kisan Organic Basket</h1><div>ताज़ी सब्ज़ी, फल और दूध आपके घर तक</div></header>
<section class="card"><h2>आपका ऑर्डर</h2><div id="products"></div><div class="total"><span>कुल राशि</span><span id="total">₹0</span></div><p class="note">डेमो में दी गई कीमतें केवल उदाहरण हैं।</p></section>
<section class="card"><h2>ग्राहक की जानकारी</h2>
<form id="orderForm">
<label for="customerName">ग्राहक का नाम *</label><input id="customerName" required placeholder="अपना नाम लिखें">
<label for="mobile">मोबाइल नंबर *</label><input id="mobile" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" required placeholder="10 अंकों का मोबाइल नंबर">
<label for="pin">PIN Code *</label><input id="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="6 अंकों का PIN Code">
<label for="address">पूरा डिलीवरी पता *</label><textarea id="address" required placeholder="गाँव/मोहल्ला, सड़क और नज़दीकी पहचान"></textarea>
<button class="submit" type="submit">ऑर्डर सबमिट करें</button></form><div id="result"></div></section>
</main><script>
const items=[["potato","आलू",30,"प्रति किलो"],["tomato","टमाटर",40,"प्रति किलो"],["apple","सेब",120,"प्रति किलो"],["banana","केला",50,"प्रति दर्जन"],["milk","दूध",60,"प्रति लीटर"],["mutton","मटन",700,"प्रति किलो"]];
const qty={};items.forEach(x=>qty[x[0]]=0);
const box=document.getElementById("products");
function total(){return items.reduce((s,x)=>s+x[2]*qty[x[0]],0)}
function draw(){box.innerHTML="";items.forEach(x=>{const d=document.createElement("div");d.className="item";d.innerHTML=`<div><b>${x[1]}</b><small>₹${x[2]} / ${x[3]}</small></div><div class="qty"><button type="button" data-id="${x[0]}" data-n="-1">−</button><b>${qty[x[0]]}</b><button type="button" data-id="${x[0]}" data-n="1">+</button></div>`;box.appendChild(d)});document.getElementById("total").textContent="₹"+total()}
box.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(!b)return;qty[b.dataset.id]=Math.max(0,qty[b.dataset.id]+Number(b.dataset.n));draw()});
document.getElementById("orderForm").addEventListener("submit",e=>{e.preventDefault();const chosen=items.filter(x=>qty[x[0]]>0);if(!chosen.length){alert("पहले कम-से-कम एक सामान चुनें।");return}
const lines=chosen.map(x=>`${x[1]}: ${qty[x[0]]} × ₹${x[2]} = ₹${qty[x[0]]*x[2]}`);
const msg=`ऑर्डर का डेमो तैयार है!\n\nनाम: ${document.getElementById("customerName").value}\nमोबाइल: ${document.getElementById("mobile").value}\nPIN Code: ${document.getElementById("pin").value}\nपता: ${document.getElementById("address").value}\n\nसामान:\n${lines.join("\n")}\n\nकुल राशि: ₹${total()}\n\nध्यान दें: यह अभ्यास वाला डेमो है। ऑर्डर अभी ऑनलाइन दुकान पर नहीं भेजा गया और डेटा सेव नहीं होता।`;
const r=document.getElementById("result");r.textContent=msg;r.style.display="block";r.scrollIntoView({behavior:"smooth"})});
draw();
</script></body></html>
